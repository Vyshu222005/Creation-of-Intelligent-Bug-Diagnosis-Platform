<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Smart Bug Analyzer & Fix Advisor</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>🤖 AI Smart Bug Analyzer & Fix Advisor</h1>

<p class="subtitle">

Analyze software bugs, detect similar historical issues, and receive AI-powered fix suggestions.

</p>

<form action="/submit" method="POST" enctype="multipart/form-data">

<div class="card">

<label><b>📝 Paste Bug Report</b></label>

<textarea

name="bug_report"

placeholder="Example:
Application crashes after clicking the Login button.
Error: NullPointerException
Steps:
1. Open Login Page
2. Enter Username & Password
3. Click Login"

required></textarea>

</div>

<div class="card">

<label><b>📁 Upload Bug Report (.txt, .log, .pdf)</b></label>

<br><br>

<input

type="file"

name="bug_file"

accept=".txt,.log,.pdf">

</div>

<div class="center">

<button type="submit">

🚀 Analyze Bug

</button>

</div>

</form>

</div>

</body>

</html>
